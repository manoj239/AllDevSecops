name: Docker CD Pipeline

on:
  workflow_run:
    workflows: ["Docker CI Pipeline"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    environment:
      name: production   # ✅ Manual approval gate

    steps:
      # 1️⃣ Login to Docker Registry
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2️⃣ Pull Docker Image built by CI
      - name: Pull Docker Image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/my-app:latest

      # 3️⃣ Push Image to JFrog Artifactory Docker Repo
      - name: Push Image to JFrog
        run: |
          docker tag \
            ${{ secrets.DOCKER_USERNAME }}/my-app:latest \
            ${{ secrets.JFROG_REGISTRY }}/my-docker/my-app:prod

          docker login ${{ secrets.JFROG_REGISTRY }} \
            -u ${{ secrets.JFROG_USERNAME }} \
            -p ${{ secrets.JFROG_ACCESS_TOKEN }}

          docker push ${{ secrets.JFROG_REGISTRY }}/my-docker/my-app:prod

      # 4️⃣ Deploy to GREEN Environment
      - name: Deploy to GREEN
        run: |
          ssh ec2-user@${{ secrets.GREEN_EC2_IP }} "
            docker pull ${{ secrets.JFROG_REGISTRY }}/my-docker/my-app:prod
            docker stop myapp || true
            docker rm myapp || true
            docker run -d \
              --name myapp \
              -p 8080:8080 \
              ${{ secrets.JFROG_REGISTRY }}/my-docker/my-app:prod
          "

      # 5️⃣ Health Check (GREEN)
      - name: Health Check (GREEN)
        run: |
          curl -f http://${{ secrets.GREEN_EC2_IP }}:8080/health

      # 6️⃣ Switch Traffic (BLUE → GREEN)
      - name: Switch Load Balancer Target
        run: |
          aws elbv2 modify-listener \
            --listener-arn ${{ secrets.LB_LISTENER_ARN }} \
            --default-actions Type=forward,TargetGroupArn=${{ secrets.GREEN_TG_ARN }}

      # 7️⃣ Optional: Stop BLUE
      - name: Stop BLUE Environment
        run: |
          ssh ec2-user@${{ secrets.BLUE_EC2_IP }} "
            docker stop myapp || true
            docker rm myapp || true
          "

      # 8️⃣ Canary Traffic Shift (Optional)
      - name: Canary Deployment (10%)
        run: |
          aws elbv2 modify-listener \
          --listener-arn ${{ secrets.LB_LISTENER_ARN }} \
          --default-actions '[
            {
              "Type":"forward",
              "ForwardConfig":{
                "TargetGroups":[
                  {"TargetGroupArn":"${{ secrets.BLUE_TG_ARN }}","Weight":90},
                  {"TargetGroupArn":"${{ secrets.GREEN_TG_ARN }}","Weight":10}
                ]
              }
            }
          ]'
