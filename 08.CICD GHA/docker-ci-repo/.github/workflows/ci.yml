name: Docker CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  docker-build-scan-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to Docker Registry
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build Docker Image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/my-app:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }} .

      # Step 5: Run Container Tests (optional but recommended)
      - name: Run container
        run: |
          docker run --rm ${{ secrets.DOCKER_USERNAME }}/my-app:latest

      # Step 6: Trivy Security Scan (similar to SonarQube Quality Gate)
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/my-app:latest
          severity: CRITICAL,HIGH
          exit-code: 1

      # Step 7: Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }}

      # Step 8: Upload Docker metadata
      - name: Upload image info
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-info
          path: |
            Dockerfile
